{% extends "base.html" %}
{% block title %}Sign in · Kinoshelf{% endblock %}
{% block body %}
<section class="panel narrow">
  <h2 class="h2">Sign in</h2>
  {% if error %}<p class="note warn" role="alert">{{ error }}</p>{% endif %}
  <form method="post" action="/login" class="stack" data-plain>
    <label>Name <input name="username" autocomplete="username" required autofocus></label>
    <label>Password <input name="password" type="password" autocomplete="current-password" required></label>
    <button class="btn primary" type="submit">Sign in</button>
  </form>
</section>
{% endblock %}
