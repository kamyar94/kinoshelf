# Builds the image on every push to main (and on version tags), publishes it to GitHub's container registry and
# signs it with cosign (keyless, through GitHub's OIDC identity; no key or secret is stored).
#   ghcr.io/<owner>/kinoshelf:latest              every change on main   (the updater's "latest" channel)
#   ghcr.io/<owner>/kinoshelf:stable              every v* tag           (the updater's "stable" channel)
#   ghcr.io/<owner>/kinoshelf:<version>-<commit>  every build, never moved
# The digest of each build is in the run's summary. Actions are pinned to commits.
name: image

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write  # keyless signing

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Names and version
        id: meta
        run: |
          owner=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml)
          echo "image=ghcr.io/${owner}/kinoshelf" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          push: true
          platforms: linux/amd64
          provenance: false  # one image manifest: what the updater pins and `docker load` reads
          sbom: false
          build-args: |
            KS_REVISION=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}-${{ steps.meta.outputs.short }}
            ${{ github.ref == 'refs/heads/main' && format('{0}:latest', steps.meta.outputs.image) || '' }}
            ${{ startsWith(github.ref, 'refs/tags/v') && format('{0}:stable', steps.meta.outputs.image) || '' }}

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2

      - name: Sign
        env:
          REF: ${{ steps.meta.outputs.image }}@${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$REF"

      - name: Summary
        env:
          REF: ${{ steps.meta.outputs.image }}@${{ steps.build.outputs.digest }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          {
            echo "### Kinoshelf ${VERSION} (${GITHUB_SHA::7})"
            echo
            echo "Image: \`${REF}\`"
            echo
            echo "Verify: \`cosign verify ${REF} --certificate-oidc-issuer https://token.actions.githubusercontent.com --certificate-identity-regexp '^https://github.com/${GITHUB_REPOSITORY}/'\`"
          } >> "$GITHUB_STEP_SUMMARY"
