# Kinoshelf, hardened.
#
# Nothing here publishes a port. Ways in, each added on top of this file through COMPOSE_FILE /
# COMPOSE_PROFILES in .env:
#   compose.local.yml   the app on 127.0.0.1 of the host (for an SSH tunnel or a browser on the host)
#   compose.lan.yml     the app on one LAN address of the host
#   profile "tunnel"    a Cloudflare Tunnel connector; the app then refuses any request that came
#                       through Cloudflare without a valid Cloudflare Access token
#   profile "route"     an Xray sidecar for lookups on a filtered network (docs/NETWORK.md); its
#                       config stays in ./route/config.json on the host, which the app never reads
# Updates (docs/UPDATES.md): the updater service fetches and checks new images; scripts/update/apply.sh, run by a
# timer on the host, installs them. No container gets the Docker socket.
# Your media folders are mounted in compose.media.yml (copy compose.media.example.yml).
#
#   app     (tunnel + app-out nets)    web app and worker, data in ./data, media mounted read-write
#   tunnel  (tunnel + tunnel-out nets) Cloudflare Tunnel connector, token only in cloudflared.env
#   route   (route + route-out nets)   Xray sidecar, server details only in ./route/config.json
#   updater (app-out + route nets)     same image, `kinoshelf update-agent`: registry checks and downloads only

name: kinoshelf

x-hardening: &hardening
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  app:
    <<: *hardening
    build: .
    image: kinoshelf:local
    container_name: kinoshelf
    # The user that owns your media folders. Read-only root filesystem; writable: /data, /tmp, media.
    user: "${PUID:?set PUID in .env}:${PGID:?set PGID in .env}"
    read_only: true
    tmpfs:
      - /tmp:size=1g,mode=1777
    env_file: .env
    environment:
      - KS_DATA_DIR=/data
      - HOME=/tmp
    volumes:
      - ./data:/data   # database, settings, keys, journals, frames. BACK THIS UP.
    extra_hosts:
      - "host.docker.internal:host-gateway"   # lets the app use a proxy that runs on the host
    networks:
      - tunnel
      - app-out
      - route
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8484/api/health',timeout=5)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    mem_limit: 2g
    memswap_limit: 2g
    cpus: 2.0
    pids_limit: 256

  updater:
    <<: *hardening
    image: kinoshelf:local
    pull_policy: never
    container_name: kinoshelf-updater
    command: ["kinoshelf", "update-agent"]
    user: "${PUID:?set PUID in .env}:${PGID:?set PGID in .env}"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    environment:
      - KS_DATA_DIR=/data
      - HOME=/tmp
    volumes:
      - ./data:/data   # reads the settings; writes only data/update (status and the fetched archive)
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - app-out
      - route
    healthcheck:
      test: ["CMD", "python", "-c", "import json,time;d=json.load(open('/data/update/agent.json'));exit(0 if time.time()-d['heartbeat']<300 else 1)"]
      interval: 120s
      timeout: 10s
      retries: 3
      start_period: 60s
    mem_limit: 512m
    memswap_limit: 512m
    cpus: 1.0
    pids_limit: 64

  tunnel:
    <<: *hardening
    profiles: ["tunnel"]
    image: cloudflare/cloudflared:${CLOUDFLARED_VERSION:?set CLOUDFLARED_VERSION in .env}
    container_name: kinoshelf-tunnel
    command: ["tunnel", "--no-autoupdate", "run"]
    env_file: cloudflared.env
    read_only: true
    depends_on:
      app:
        condition: service_started
    networks:
      - tunnel
      - tunnel-out
    mem_limit: 256m
    memswap_limit: 256m
    cpus: 1.0
    pids_limit: 100

  route:
    <<: *hardening
    profiles: ["route"]
    # Official Xray image (distroless). Its config is yours and stays on the host; Settings > Network >
    # Route sidecar sends the chosen lookups to http://route:10809.
    image: ghcr.io/xtls/xray-core:${XRAY_VERSION:-26.9.30}
    container_name: kinoshelf-route
    user: "${PUID:?set PUID in .env}:${PGID:?set PGID in .env}"
    read_only: true
    volumes:
      - ./route/config.json:/usr/local/etc/xray/config.json:ro
    networks:
      - route
      - route-out
    mem_limit: 256m
    memswap_limit: 256m
    cpus: 1.0
    pids_limit: 100

networks:
  # tunnel <-> app. No internet.
  tunnel:
    internal: true
  # Outbound only, for the tunnel connector to reach Cloudflare.
  tunnel-out: {}
  # Outbound only, for lookups (TMDB, TVmaze, OMDb, OpenSubtitles, IMDb datasets) and Jellyfin.
  app-out: {}
  # app <-> route sidecar. No internet.
  route:
    internal: true
  # Outbound only, for the route sidecar to reach your server.
  route-out: {}
