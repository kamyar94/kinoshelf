[project]
name = "kinoshelf"
version = "0.4.0"
description = "Self-hosted inbox that names, checks and files new films and episodes into a media library."
readme = "README.md"
license = "LicenseRef-KF-SA-1.0"
license-files = ["LICENSE.md", "LICENSING.md"]
authors = [{ name = "Kamyar Fatemifar" }]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "jinja2>=3.1",
    "python-multipart>=0.0.18",
    "httpx[socks]>=0.28",  # socks: SOCKS5 proxies (socksio, about 30 KB)
    "pyyaml>=6.0",
    "guessit>=3.8",
    "rapidfuzz>=3.10",
    "anyascii>=0.3.2",
    "argon2-cffi>=23.1",
    "pyjwt[crypto]>=2.10",
    "pillow>=11",
    "numpy>=2.0",
]

[project.optional-dependencies]
subtitles = ["subliminal>=2.2"]
icons = ["onnxruntime>=1.20"]  # text and face detection for folder icons (without it the picture is centred)
dev = ["pytest>=8"]

[project.scripts]
kinoshelf = "kinoshelf.__main__:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kinoshelf"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
